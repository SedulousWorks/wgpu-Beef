FileVersion = 1

[Project]
Name = "wgpu-Beef-Test-Web"
TargetType = "BeefGUIApplication"
StartupObject = "wgpu_Beef_Test_Web.Program"

[Dependencies]
corlib = "*"
wgpu-Beef = "*"

[Configs.Debug.wasm32]
TargetDirectory = "$(ProjectDir)\\dist\\"
OtherLinkFlags = "$(LinkFlags) --use-port=emdawnwebgpu:cpp_bindings=false -s ALLOW_MEMORY_GROWTH=1 -s ASSERTIONS=1"

[Configs.Release.wasm32]
TargetDirectory = "$(ProjectDir)\\dist\\"
OtherLinkFlags = "$(LinkFlags) --use-port=emdawnwebgpu:cpp_bindings=false -s ALLOW_MEMORY_GROWTH=1 --closure=1"
